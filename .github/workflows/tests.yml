name: tests

on:
  push:
    branches:
      - main
  # `edited` re-runs the checks when a chained PR is retargeted to a new base branch.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Tests run against MySQL, never SQLite (AGENTS.md §2), mirroring the Sail stack.
    services:
      mysql:
        image: 'mysql:8.4'
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Environment variables take precedence over the .env copied from .env.example.
    # Root is used so the audit triggers can be created while binary logging is on.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PHP, Node and pnpm versions match the Sail image (sail-8.5).
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
